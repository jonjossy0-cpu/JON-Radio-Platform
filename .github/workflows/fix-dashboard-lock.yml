name: Apply dashboard lock refresh fix

on:
  push:
    branches:
      - main
      - fix-dashboard-lock-refresh-20261004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch lock persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s2 = s
          s2 = s2.replace('const AUTH_TOKEN_KEY = "jonRadioAdminSession";\nlet authToken = sessionStorage.getItem(AUTH_TOKEN_KEY) || "";', 'const AUTH_TOKEN_KEY = "jonRadioAdminSession";\nconst DASHBOARD_LOCK_KEY = "jonRadioDashboardLocked";\nlet authToken = sessionStorage.getItem(AUTH_TOKEN_KEY) || "";')
          s2 = s2.replace('authToken = result.token;\n    sessionStorage.setItem(AUTH_TOKEN_KEY, authToken);\n    document.getElementById("adminPassword").value = "";', 'authToken = result.token;\n    sessionStorage.setItem(AUTH_TOKEN_KEY, authToken);\n    localStorage.removeItem(DASHBOARD_LOCK_KEY);\n    document.getElementById("adminPassword").value = "";', 1)
          s2 = s2.replace('authToken = "";\n  sessionStorage.removeItem(AUTH_TOKEN_KEY);\n  document.body.classList.remove("authenticated");', 'authToken = "";\n  sessionStorage.removeItem(AUTH_TOKEN_KEY);\n  localStorage.removeItem(DASHBOARD_LOCK_KEY);\n  document.body.classList.remove("authenticated");', 1)
          s2 = s2.replace('async function checkAdminSession(){\n  if(!authToken) return;', 'async function checkAdminSession(){\n  if(localStorage.getItem(DASHBOARD_LOCK_KEY) === "1"){\n    authToken = "";\n    sessionStorage.removeItem(AUTH_TOKEN_KEY);\n    document.body.classList.add("dashboard-locked");\n    return;\n  }\n  if(!authToken) return;')
          s2 = s2.replace('function lockDashboard(){\n  dashboardLocked = true;', 'function lockDashboard(){\n  dashboardLocked = true;\n  authToken = "";\n  sessionStorage.removeItem(AUTH_TOKEN_KEY);\n  localStorage.setItem(DASHBOARD_LOCK_KEY, "1");\n  document.body.classList.remove("authenticated");')
          s2 = s2.replace('authToken = result.token;\n    sessionStorage.setItem(AUTH_TOKEN_KEY, authToken);\n    dashboardLocked = false;', 'authToken = result.token;\n    sessionStorage.setItem(AUTH_TOKEN_KEY, authToken);\n    localStorage.removeItem(DASHBOARD_LOCK_KEY);\n    document.body.classList.add("authenticated");\n    dashboardLocked = false;')
          s2 = s2.replace('body.authenticated #lockButton{display:inline-block !important;}', 'body.authenticated #lockButton{display:inline-block !important;}\nbody.dashboard-locked #loginGate{display:none;}')
          if s2 == s:
              raise SystemExit('No patch was applied')
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard lock persistence across refresh"
          git push
