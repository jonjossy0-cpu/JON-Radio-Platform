name: Validate JON Radio Platform
on:
  push:
    branches: [rebuild-2.0]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check radio/broadcast.js
      - run: node --check radio/autodj.js
      - run: node --check radio/live.js
      - run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');if(!h.includes('<!doctype html>')||!h.includes('JON FM ETHIOPIA'))process.exit(1);if(h.includes('\\\\n'))process.exit(1);if(!h.includes('async function api('))process.exit(1);if(!h.includes('/api/autodj/play'))process.exit(1);if(!h.includes('/api/autodj/jingle/settings'))process.exit(1);console.log('HTML basic validation OK')"
