<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JON Radio Platform</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: #0b63ce;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .station {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 12px;
      background: #0b63ce;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .station-info {
      flex: 1;
    }

    .station-info h2 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .online {
      color: #16a34a;
      font-size: 14px;
      font-weight: bold;
    }

    .offline {
      color: #dc2626;
      font-size: 14px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .play {
      background: #0b63ce;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    .add {
      width: 100%;
      background: #111827;
      color: white;
      margin-top: 5px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #64748b;
      font-size: 13px;
    }

    @media (min-width: 650px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JON RADIO PLATFORM</h1>
    <p>Multi-Radio Management & Streaming Platform</p>
  </header>

  <main class="container">

    <div class="card">
      <h2 class="section-title">Dashboard</h2>

      <div class="stats">
        <div class="stat">
          <strong id="stationCount">1</strong>
          Stations
        </div>

        <div class="stat">
          <strong>1</strong>
          Online
        </div>

        <div class="stat">
          <strong id="listenerCount">0</strong>
          Listeners
        </div>

        <div class="stat">
          <strong>24/7</strong>
          Service
        </div>
      </div>
    </div>

    <div class="card">

      <h2 class="section-title">Radio Stations</h2>

      <div class="station">

        <div class="logo">
          JON
        </div>

        <div class="station-info">
          <h2>JON FM ETHIOPIA</h2>
          <span id="status" class="online">
            ● Online
          </span>
        </div>

      </div>

      <div class="buttons">

        <button class="play" onclick="playRadio()">
          ▶ Play
        </button>

        <button class="stop" onclick="stopRadio()">
          ■ Stop
        </button>

      </div>

      <audio id="radioPlayer" controls style="width:100%; margin-top:15px; display:none;"></audio>

    </div>

    <div class="card">

      <h2 class="section-title">Station Management</h2>

      <button class="add" onclick="addStation()">
        ＋ Add Radio Station
      </button>

    </div>

  </main>

  <footer>
    © 2026 JON MEDIA SERVICE — For Advanced Growth.
  </footer>

  <script>

    function playRadio() {
      alert("JON FM stream will be connected when the new radio server is ready.");
    }

    function stopRadio() {
      const player = document.getElementById("radioPlayer");

      player.pause();
      player.removeAttribute("src");

      alert("Radio stopped.");
    }

    function addStation() {
      alert("Add Station system will be added in the next stage.");
    }

  </script>

</body>
</html>
